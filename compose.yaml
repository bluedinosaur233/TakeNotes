services:
  app:
    build: .
    image: takenotes:local
    init: true
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DATABASE_URL: file:/app/data/takenotes.db
      NODE_ENV: production
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
